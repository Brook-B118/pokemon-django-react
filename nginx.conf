worker_processes 1; # in production, set to number of available cpu cores or auto to let nginx handle it

events {
    worker_connections 1024; # per worker process, how many simulatenous connections can be opened
}

http {
    upstream pokemontcg_django_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Pass client information to the backend
            proxy_pass http://pokemontcg_django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
